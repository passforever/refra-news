name: 每日资讯爬取 & 部署

on:
  push:
    branches:
      - master
  schedule:
    # 每天北京时间 07:00（UTC 23:00）自动执行
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 支持手动触发

permissions:
  contents: write

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: 爬取资讯 & 构建部署

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install crawler dependencies
        run: |
          pip install -r app/crawler/requirements.txt

      - name: Run generic crawler
        timeout-minutes: 3
        run: |
          python app/crawler/crawler.py
        continue-on-error: true

      - name: Run Taike Steel crawler
        timeout-minutes: 3
        run: |
          python app/crawler/taike_crawler.py
        continue-on-error: true

      - name: Run WeChat crawler
        timeout-minutes: 3
        run: |
          python app/crawler/wechat_crawler.py
        continue-on-error: true

      - name: Verify crawled data
        run: |
          echo "=== Checking crawled data files ==="
          ls -la app/src/data/taikeNews.json 2>/dev/null && echo "✓ taikeNews.json exists" || echo "✗ taikeNews.json missing"
          ls -la app/src/data/newsData.json 2>/dev/null && echo "✓ newsData.json exists" || echo "✗ newsData.json missing"
          ls -la app/src/data/wechatNews.json 2>/dev/null && echo "✓ wechatNews.json exists" || echo "✗ wechatNews.json missing"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd app && npm ci

      - name: Build frontend
        run: |
          cd app && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: '🤖 每日资讯自动更新 ${{ github.run_number }}'
